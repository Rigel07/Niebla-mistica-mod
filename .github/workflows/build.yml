name: Build Niebla Mística

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Buscar y preparar proyecto
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: no se encontró ningún ZIP del mod."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          mkdir -p proyecto

          unzip -q "$ZIP" -d proyecto

          echo ""
          echo "=== CONTENIDO DEL ZIP ==="
          find proyecto -maxdepth 4 -type f | sort

          SETTINGS=$(find proyecto -type f -name settings.gradle | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR: el ZIP no contiene settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo ""
          echo "=== ESTRUCTURA DEL PROYECTO ==="
          find "$PROJECT_DIR" -maxdepth 4 -type d | sort

          if [ ! -d "$PROJECT_DIR/src/main/java" ]; then
            echo ""
            echo "ERROR: el proyecto no contiene src/main/java"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/src/main/resources" ]; then
            echo ""
            echo "ERROR: el proyecto no contiene src/main/resources"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo ""
            echo "ERROR: falta build.gradle"
            exit 1
          fi

          echo ""
          echo "=== ESTRUCTURA CORRECTA ==="

      - name: Compilar Niebla Mística
        shell: bash
        run: |
          set -e

          SETTINGS=$(find proyecto -type f -name settings.gradle | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          cd "$PROJECT_DIR"

          echo "Compilando desde:"
          pwd

          gradle build --no-daemon

      - name: Buscar JAR
        run: |
          echo "=== JAR GENERADO ==="
          find proyecto -type f -path '*/build/libs/*.jar' -ls

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: niebla-mistica-jar
          path: proyecto/**/build/libs/*.jar
